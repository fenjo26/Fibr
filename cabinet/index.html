<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fibr — личный кабинет</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/user.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <!-- login: Telegram Login Widget -->
    <section id="login-view" class="card login-card">
      <div class="brand-badge">
        <img class="brand-logo-large" src="favicon.svg" alt="Fibr" width="48" height="48">
        <div>
          <h1>Fibr</h1>
          <p class="muted" id="login-hint"></p>
        </div>
      </div>
      <!-- main door: own login + password -->
      <form id="pw-form" style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
        <input class="input" id="pw-login" autocomplete="username" autocapitalize="off" spellcheck="false">
        <input class="input" id="pw-pass" type="password" autocomplete="current-password">
        <button class="btn" id="pw-go" type="submit"></button>
      </form>
      <!-- personal code / login link / invite link (no Telegram) -->
      <details class="guide-sec" style="margin-top:12px">
        <summary id="code-toggle"></summary>
        <div class="add-row" style="margin:0 12px 12px">
          <input class="input" id="login-link" autocomplete="off" spellcheck="false">
          <button class="btn" id="login-go"></button>
        </div>
      </details>
      <!-- optional: Telegram Login Widget (needs /setdomain in @BotFather) -->
      <button class="btn btn--tertiary btn--small" id="tg-toggle" style="margin-top:12px"></button>
      <div id="tg-widget" class="hidden" style="margin-top:12px"></div>
      <p class="faint login-foot" id="login-foot"></p>
    </section>

    <!-- error state -->
    <section id="error-view" class="card hidden">
      <div class="brand-title">
        <img class="brand-logo" src="favicon.svg" alt="Fibr" width="32" height="32">
        <h2>Fibr</h2>
      </div>
      <p id="error-text" class="muted"></p>
      <button class="btn btn--tertiary btn--small" id="back"></button>
    </section>

    <!-- app (same layout as the Mini App) -->
    <section id="app-view" class="hidden">
      <header class="head">
        <div class="brand-title">
          <img class="brand-logo" src="favicon.svg" alt="Fibr" width="36" height="36">
          <div>
            <h1>Fibr</h1>
            <p class="muted" id="greeting"></p>
          </div>
        </div>
        <div class="head-actions">
          <button class="btn btn--tertiary btn--small btn--icon" data-theme-toggle title="Theme"><svg class="theme-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
          <button class="btn btn--ghost btn--small" id="logout"></button>
        </div>
      </header>

      <div class="card summary">
        <div class="summary-row">
          <div><span class="muted" id="lbl-devices"></span><b id="sum-devices">—</b></div>
          <div><span class="muted" id="lbl-online"></span><b id="sum-online">—</b></div>
          <div><span class="muted" id="lbl-traffic"></span><b id="sum-traffic">—</b></div>
        </div>
        <p class="muted sum-expiry" id="sum-expiry"></p>
      </div>

      <p class="muted sec-hint" id="devices-hint"></p>
      <button class="btn btn--small guide-btn" id="guide-open"></button>

      <div class="add-row">
        <input class="input" id="new-name" maxlength="32">
        <select class="input input--proto" id="new-proto" title="Protocol">
          <option value="wg">WireGuard</option>
          <option value="xray">VLESS</option>
        </select>
        <button class="btn" id="add-device"></button>
      </div>

      <div id="devices"></div>

      <!-- reseller section: visible only to admins/superadmins -->
      <section id="users-view" class="hidden">
        <div class="sec-head">
          <div>
            <h2 id="users-title"></h2>
            <p class="muted" id="users-hint"></p>
          </div>
          <button class="btn btn--tertiary btn--small" id="invite-create"></button>
        </div>
        <div id="users"></div>
      </section>

      <!-- referral section: every account (docs/referrals.md) -->
      <section id="ref-view" class="hidden">
        <div class="sec-head">
          <div>
            <h2 id="ref-title"></h2>
            <p class="muted" id="ref-hint"></p>
          </div>
          <button class="btn btn--tertiary btn--small" id="ref-copy"></button>
        </div>
        <div id="ref-body"></div>
      </section>

      <!-- app key section: server login for the Fibr mobile app -->
      <section id="pw-view" class="hidden">
        <div class="sec-head">
          <div>
            <h2 id="pw-title"></h2>
            <p class="muted" id="pw-hint"></p>
          </div>
        </div>
        <div class="card key-card">
          <form id="pw-set" style="display:flex;flex-direction:column;gap:8px">
            <input class="input" id="pw-new-login" autocomplete="username" autocapitalize="off" spellcheck="false">
            <input class="input" id="pw-new-pass" type="password" autocomplete="new-password">
            <button class="btn btn--small" id="pw-save" type="submit"></button>
          </form>
        </div>
      </section>

      <section id="key-view" class="hidden">
        <div class="sec-head">
          <div>
            <h2 id="key-title"></h2>
            <p class="muted" id="key-hint"></p>
          </div>
        </div>
        <div class="card key-card">
          <div class="key-row">
            <span class="pill pill--off" id="key-status"></span>
            <span class="key-actions">
              <button class="btn btn--tertiary btn--small hidden" id="key-revoke"></button>
              <button class="btn btn--small" id="key-create"></button>
            </span>
          </div>
        </div>
      </section>

      <p class="muted foot-hint" id="foot-hint"></p>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal" id="modal-body"></div>
  </div>

  <script src="/shared/app.js"></script>
  <script src="app.js"></script>
</body>
</html>
