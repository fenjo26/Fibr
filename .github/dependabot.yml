# Dependabot: weekly dependency update PRs.
version: 2
updates:
  # Go modules for the server — go.mod/go.sum live in /server, not at root.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Base images in server/Dockerfile (golang:1.26-alpine, alpine:3.20).
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Action versions used in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
