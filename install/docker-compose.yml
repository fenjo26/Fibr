name: fibr

services:
  fibr:
    build:
      context: ../server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    devices:
      - /dev/net/tun:/dev/net/tun # fallback for wireguard-go userspace
    ports:
      - "${FIBR_WG_PORT:-51820}:${FIBR_WG_PORT:-51820}/udp"
    volumes:
      - fibr-data:/data
      # Client binaries for the bot's /app command (Telegram-side APK
      # delivery); filled by install/sync-downloads.sh.
      - ../download:/download:ro
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Xray (VLESS + Reality) — DPI-resistant second protocol, ON by default:
  # every user can pick WireGuard or VLESS. (FIBR_XRAY_ENABLED=false in .env
  # turns it off; then also stop this container: docker compose stop xray.)
  # fibr renders /data/xray/config.json on the shared fibr-data volume; this
  # container just runs it. Device changes apply LIVE through xray's gRPC
  # API (port 10085, compose network only — deliberately not published);
  # the access log on the volume feeds the one-link-one-device limiter
  # (docs/xray.md).
  xray:
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    # The config is read from the shared volume directly (/data/xray/config.json).
    # A single-file mount from a named volume would need the newer compose
    # "subpath" syntax; pointing the command at the volume path is portable.
    command: ["run", "-c", "/data/xray/config.json"]
    ports:
      - "${FIBR_XRAY_PORT:-8443}:${FIBR_XRAY_PORT:-8443}/tcp"
    volumes:
      - fibr-data:/data
    depends_on:
      - fibr

  # One-click updater sidecar (docs/updates.md). Opt-in via the compose
  # profile "updater" (install.sh --with-updater sets COMPOSE_PROFILES).
  # It pulls the repo checkout mounted at /repo and rebuilds THIS stack
  # through the docker socket when the superadmin presses "Update" in the
  # admin panel. SECURITY TRADE-OFF: docker.sock access means the updater
  # is effectively root on the host — enable it only on a server you trust.
  # No published ports: fibr talks to it at http://updater:8912 inside the
  # compose network, and the trigger is admin-token-gated in fibr.
  updater:
    build:
      context: ..
      dockerfile: install/Dockerfile.updater
    restart: unless-stopped
    environment:
      FIBR_REPO_DIR: /repo
    volumes:
      - ..:/repo:rw
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - updater

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FIBR_DOMAIN: ${FIBR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ../admin:/srv/admin:ro
      - ../miniapp:/srv/miniapp:ro
      - ../cabinet:/srv/cabinet:ro
      - ../design:/srv/shared:ro
      - ../download:/srv/download:ro
    depends_on:
      - fibr

volumes:
  fibr-data:
  caddy-data:
  caddy-config:
