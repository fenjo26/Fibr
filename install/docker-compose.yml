name: fibr

services:
  fibr:
    build:
      context: ../server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    devices:
      - /dev/net/tun:/dev/net/tun # fallback for wireguard-go userspace
    ports:
      - "${FIBR_WG_PORT:-51820}:${FIBR_WG_PORT:-51820}/udp"
    volumes:
      - fibr-data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Xray (VLESS + Reality) — DPI-resistant second protocol, opt-in.
  # Started only when the compose profile "xray" is active, i.e. when .env
  # sets COMPOSE_PROFILES=xray (install.sh does this for --xray installs).
  # fibr renders /data/xray/config.json on the shared fibr-data volume; this
  # container just runs it. fibr deliberately has NO docker socket access, so
  # after fibr rewrites the config (device added/removed/toggled) apply it
  # manually on the host:
  #   docker compose -f /opt/fibr/install/docker-compose.yml restart xray
  xray:
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    # The config is read from the shared volume directly (/data/xray/config.json).
    # A single-file mount from a named volume would need the newer compose
    # "subpath" syntax; pointing the command at the volume path is portable.
    command: ["run", "-c", "/data/xray/config.json"]
    ports:
      - "${FIBR_XRAY_PORT:-8443}:${FIBR_XRAY_PORT:-8443}/tcp"
    volumes:
      - fibr-data:/data
    depends_on:
      - fibr
    profiles:
      - xray

  # One-click updater sidecar (docs/updates.md). Opt-in via the compose
  # profile "updater" (install.sh --with-updater sets COMPOSE_PROFILES).
  # It pulls the repo checkout mounted at /repo and rebuilds THIS stack
  # through the docker socket when the superadmin presses "Update" in the
  # admin panel. SECURITY TRADE-OFF: docker.sock access means the updater
  # is effectively root on the host — enable it only on a server you trust.
  # No published ports: fibr talks to it at http://updater:8912 inside the
  # compose network, and the trigger is admin-token-gated in fibr.
  updater:
    build:
      context: ..
      dockerfile: install/Dockerfile.updater
    restart: unless-stopped
    environment:
      FIBR_REPO_DIR: /repo
    volumes:
      - ..:/repo:rw
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - updater

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FIBR_DOMAIN: ${FIBR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ../admin:/srv/admin:ro
      - ../miniapp:/srv/miniapp:ro
      - ../cabinet:/srv/cabinet:ro
      - ../design:/srv/shared:ro
      - ../download:/srv/download:ro
    depends_on:
      - fibr

volumes:
  fibr-data:
  caddy-data:
  caddy-config:
