name: fibr
description: Fibr VPN client — WireGuard tunnels with QR import and split tunneling.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management.
  provider: ^6.1.2
  # Settings + tunnel list persistence.
  shared_preferences: ^2.2.2
  # QR-code scanning (camera).
  mobile_scanner: ^7.0.0
  # WireGuard tunnel engine (Android/iOS/desktop; wraps WireGuardKit on iOS).
  wireguard_flutter: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Inter 600/800 per design tokens (design/tokens.css). The TTFs are not
  # committed; download Inter-SemiBold.ttf and Inter-ExtraBold.ttf from
  # https://github.com/rsms/inter/releases into assets/fonts/ and uncomment:
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
  #
  # Without the assets the app falls back to the platform font; everything
  # still works (see README.md, "Шрифты").
