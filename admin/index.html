<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fibr Admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- login -->
  <div id="login" class="modal-backdrop">
    <form class="modal" id="login-form">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
        <img src="favicon.svg" alt="" width="32" height="32" style="border-radius:8px;">
        <h2>Fibr Admin</h2>
      </div>
      <p class="muted" data-i18n="loginHint"></p>
      <input class="input" type="password" id="login-token" autocomplete="current-password" placeholder="token">
      <p class="login-err" id="login-err"></p>
      <button class="btn btn--wide" type="submit" data-i18n="loginBtn"></button>
    </form>
  </div>

  <header class="topbar">
    <div class="brand"><img src="favicon.svg" alt="" width="22" height="22" style="border-radius:6px; vertical-align:middle; margin-right:8px;">Fibr <span class="pill pill--live">admin</span></div>
    <div class="topbar-right">
      <!-- Mobile: opens the tab drawer (the tab strip collapses on phones). -->
      <button class="btn btn--tertiary btn--small nav-burger" id="nav-burger"
              aria-expanded="false" aria-controls="main-tabs">☰ <span id="nav-burger-label"></span></button>
      <span class="muted mono" id="server-host"></span>
      <!-- One-click update badge (docs/updates.md): shown only when the
           opt-in updater sidecar reports the install is behind origin/main
           or a newer release tag exists. -->
      <button class="pill pill--live update-badge hidden" id="update-badge">↻ <span data-i18n="updateBadge"></span></button>
      <select class="input input--lang" id="lang" title="Language">
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button class="btn btn--tertiary btn--small btn--icon" data-theme-toggle title="Theme"><svg class="theme-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
      <button class="btn btn--ghost btn--small" id="logout" data-i18n="logout"></button>
    </div>
  </header>

  <nav class="tabs" id="main-tabs">
    <button class="tab active" data-tab="dashboard" data-i18n="tabDash"></button>
    <button class="tab" data-tab="users" data-i18n="tabUsers"></button>
    <button class="tab" data-tab="devices" data-i18n="tabDevices"></button>
    <button class="tab" data-tab="dns" data-i18n="tabDNS"></button>
    <button class="tab" data-tab="nodes" data-i18n="tabNodes"></button>
    <button class="tab" data-tab="referrals" data-i18n="tabReferrals"></button>
    <button class="tab" data-tab="settings" data-i18n="tabSettings"></button>
  </nav>

  <main>
    <!-- dashboard -->
    <section id="tab-dashboard" class="page">
      <div class="stat-grid">
        <div class="card stat"><span class="muted" data-i18n="stOnline"></span><b id="st-online">—</b></div>
        <div class="card stat"><span class="muted" data-i18n="stUsers"></span><b id="st-users">—</b></div>
        <div class="card stat"><span class="muted" data-i18n="stDevices"></span><b id="st-devices">—</b></div>
        <div class="card stat"><span class="muted" data-i18n="stExpired"></span><b id="st-expired">—</b></div>
        <div class="card stat"><span class="muted" data-i18n="stTraffic"></span><b id="st-traffic">—</b></div>
        <div class="card stat"><span class="muted" data-i18n="stTunnel"></span><b id="st-tunnel">—</b></div>
      </div>
      <div class="two-col">
        <div class="card">
          <h3 data-i18n="serverCard"></h3>
          <p class="muted active-node hidden" id="active-node"></p>
          <dl class="kv" id="server-info"></dl>
        </div>
        <div class="card">
          <h3 data-i18n="recentCard"></h3>
          <div class="table-scroll">
            <table class="table table-cards" id="recent-table"></table>
          </div>
        </div>
      </div>
    </section>

    <!-- users -->
    <section id="tab-users" class="page hidden">
      <div class="card toolbar">
        <input class="input" id="nu-telegram" type="number" data-i18n-ph="phTelegram">
        <input class="input" id="nu-username" data-i18n-ph="phUsername">
        <select class="input" id="nu-role">
          <option value="user" data-i18n="roleUser"></option>
          <option value="admin" data-i18n="roleAdmin"></option>
        </select>
        <button class="btn" id="nu-create" data-i18n="addUser"></button>
      </div>
      <div class="card">
        <div class="table-scroll">
          <table class="table table-cards" id="users-table"></table>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="invitesTitle"></h3>
        <div class="toolbar">
          <input class="input" id="inv-note" data-i18n-ph="phInviteNote">
          <button class="btn" id="inv-create" data-i18n="btnInviteCreate"></button>
        </div>
        <div class="table-scroll">
          <table class="table table-cards" id="invites-table"></table>
        </div>
      </div>
    </section>

    <!-- devices -->
    <section id="tab-devices" class="page hidden">
      <div class="card">
        <div class="table-scroll">
          <table class="table table-cards" id="devices-table"></table>
        </div>
      </div>
    </section>

    <!-- DNS protection (docs/dns-games.md): stats, per-device profiles,
         blocklists and the query log. -->
    <section id="tab-dns" class="page hidden">
      <div class="card hidden" id="dns-off-card"><p class="muted" id="dns-off-badge"></p></div>
      <div id="dns-content" class="hidden">
        <div class="card">
          <h3 data-i18n="dnsStatsTitle"></h3>
          <div class="stat-grid">
            <div class="card stat"><span class="muted" data-i18n="dnsQueries"></span><b id="dns-st-total">—</b></div>
            <div class="card stat"><span class="muted" data-i18n="dnsBlocked"></span><b id="dns-st-blocked">—</b></div>
            <div class="card stat"><span class="muted" data-i18n="dnsSafesearch"></span><b id="dns-st-safesearch">—</b></div>
          </div>
          <p class="muted" data-i18n="dnsTopBlocked"></p>
          <div class="table-scroll">
            <table class="table table-cards" id="dns-top-table"></table>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="dnsDevicesTitle"></h3>
          <p class="muted" id="dns-devices-hint"></p>
          <div class="table-scroll">
            <table class="table table-cards" id="dns-devices-table"></table>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="dnsListsTitle"></h3>
          <div class="dns-toolbar">
            <input class="input" id="dns-list-name" data-i18n-ph="dnsListName" maxlength="32">
            <input class="input grow" id="dns-list-url" data-i18n-ph="dnsListURL" maxlength="512">
            <button class="btn" id="dns-list-add" data-i18n="dnsAddList"></button>
            <button class="btn btn--secondary" id="dns-lists-refresh" data-i18n="dnsRefresh"></button>
          </div>
          <div class="table-scroll">
            <table class="table table-cards" id="dns-lists-table"></table>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="dnsLogTitle"></h3>
          <div class="table-scroll">
            <table class="table table-cards" id="dns-log-table"></table>
          </div>
        </div>
      </div>
    </section>

    <!-- nodes (docs/multinode.md) -->
    <section id="tab-nodes" class="page hidden">
      <div class="card nodes-toolbar">
        <span class="muted" data-i18n="nodesHint"></span>
        <button class="btn" id="node-create" data-i18n="btnAddNode"></button>
      </div>
      <div class="card">
        <div class="table-scroll">
          <table class="table table-cards" id="nodes-table"></table>
        </div>
      </div>
    </section>

    <!-- referrals (docs/referrals.md) -->
    <section id="tab-referrals" class="page hidden">
      <div class="card">
        <h3 data-i18n="refTreeTitle"></h3>
        <p class="muted" id="ref-terms"></p>
        <div class="table-scroll">
          <table class="table table-cards" id="referrals-table"></table>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="payoutsTitle"></h3>
        <div class="table-scroll">
          <table class="table table-cards" id="payouts-table"></table>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="paymentsTitle"></h3>
        <div class="table-scroll">
          <table class="table table-cards" id="payments-table"></table>
        </div>
      </div>
    </section>

    <!-- settings (referral program; docs/referrals.md) -->
    <section id="tab-settings" class="page hidden">
      <div class="card settings-card">
        <h3 data-i18n="settingsTitle"></h3>
        <label class="settings-row"><input type="checkbox" id="set-enabled"> <span data-i18n="setEnabled"></span></label>
        <label class="settings-row"><span data-i18n="setPercents" class="grow"></span>
          <span class="settings-inline"><input class="input input--num" id="set-p1" type="number" min="0" max="100"> % L1 +
          <input class="input input--num" id="set-p2" type="number" min="0" max="100"> % L2</span>
        </label>
        <label class="settings-row"><span data-i18n="setCurrency" class="grow"></span>
          <input class="input input--num" id="set-currency" maxlength="16" placeholder="₽ / USDT">
        </label>
        <label class="settings-row settings-row--col"><span data-i18n="setContacts"></span>
          <textarea class="input" id="set-contact" rows="4" data-i18n-ph="phContacts"></textarea>
        </label>
        <p class="muted" data-i18n="setContactsHint"></p>
        <div><button class="btn" id="set-save" data-i18n="setSave"></button></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal" id="modal-body"></div>
  </div>

  <script src="/shared/app.js"></script>
  <script src="app.js"></script>
</body>
</html>
